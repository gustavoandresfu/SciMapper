[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scimapper"
version = "1.0.0"
authors = [
  { name="Gustavo Andrés Futo", email="gustavoandresfu@gmail.com" },
]
description = "An automated scientific mapping and systematic literature review framework with dense semantic clustering and PRISMA 2020 compliance."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
  "systematic-literature-review",
  "systematic-mapping-study",
  "scimapper",
  "scientific-mapping",
  "topic-modeling",
  "sentence-transformers",
  "bertopic",
  "prisma-2020",
  "openalex",
  "evidence-synthesis",
  "nlp"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "requests>=2.28.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "plotly>=5.13.0",
    "python-docx>=0.8.11",
    "tqdm>=4.65.0"
]

[project.urls]
"Homepage" = "https://github.com/gustavoandresfu/SciMapper"
"Bug Tracker" = "https://github.com/gustavoandresfu/SciMapper/issues"

[project.scripts]
scimapper = "main:main"
